name: Setup Rust
description: Install the stable Rust toolchain with optional components, enable build caching and ALSA dev headers (required by the cpal dev-dependency on Ubuntu hosts).

inputs:
  components:
    description: Space-separated rustup components to install (e.g. "fmt clippy")
    required: false
    default: ""
  cache:
    description: Enable the shared Rust build cache (true/false)
    required: false
    default: "true"
  alsa:
    description: Install libasound2-dev (true/false)
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: ${{ inputs.components }}

    - name: Enable Rust cache
      if: ${{ inputs.cache == 'true' }}
      uses: Swatinem/rust-cache@v2

    - name: Install ALSA development headers
      if: ${{ inputs.alsa == 'true' }}
      run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      shell: bash