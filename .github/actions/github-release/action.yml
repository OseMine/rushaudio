name: Create GitHub Release
description: "Derive the version from the pushed tag, build a changelog from git log, and create the GitHub release. Requires `permissions: contents: write` in the calling workflow."

runs:
  using: composite
  steps:
    - name: Get version
      id: version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      shell: bash

    - name: Build changelog
      id: changelog
      run: |
        CHANGELOG=$(git log --pretty=format:"- %s (%h)" $(git describe --tags --abbrev=0 HEAD^)..HEAD)
        echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
        echo "$CHANGELOG" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
      shell: bash

    - name: Create release
      uses: softprops/action-gh-release@v2
      with:
        name: v${{ steps.version.outputs.VERSION }}
        body: |
          ## Changes
          ${{ steps.changelog.outputs.CHANGELOG }}

          ## Install
          ```toml
          [dependencies]
          rushaudio = "${{ steps.version.outputs.VERSION }}"
          ```
        generate_release_notes: true